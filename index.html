<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="職業安全衛生選擇題練習" />
    <title>職業安全衛生測驗</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 5 58 16v16c0 15-10 24-26 28C16 56 6 47 6 32V16z' fill='%23b45309'/%3E%3Cpath d='M32 16v28M18 30h28' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="masthead">
        <div>
          <p class="eyebrow">OCCUPATIONAL SAFETY</p>
          <h1>職業安全衛生測驗</h1>
          <p class="subtitle">每次 10 題，答對後不再重複出題。</p>
        </div>
        <div class="progress-card" aria-live="polite"><span>待練習題數</span><strong id="remaining-count">--</strong></div>
      </header>
      <section id="quiz-screen" aria-labelledby="quiz-heading">
        <div class="quiz-meta"><span id="quiz-heading">本次測驗：10 題</span><span id="answer-count">已作答 0 / 10</span></div>
        <div id="questions" class="questions"></div>
        <button id="submit-button" class="primary-button" type="button">送出並評分</button>
      </section>
      <section id="result-screen" class="hidden" aria-labelledby="result-title">
        <div class="result-summary"><p class="eyebrow">RESULT</p><h2 id="result-title">本次完成</h2><p id="score-text" class="score-text"></p><p id="result-message" class="result-message"></p></div>
        <div id="mistakes" class="mistakes"></div>
        <button id="retry-button" class="primary-button" type="button">再次測驗</button>
      </section>
    </main>
    <script src="questions.js"></script>
    <script src="app.js"></script>
  </body>
</html>
